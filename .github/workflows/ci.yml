name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted="$(gofmt -l . | grep -v '/generated/' || true)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race ./...

      - uses: dtolnay/rust-toolchain@stable

      - name: install fomoxac
        run: cargo install fomoxac --version 0.2.1 --locked

      - name: the committed demo tree is current
        working-directory: examples/demo
        run: |
          printf 'module github.com/fomoxa/frpc-go/examples/demo\n' > go.mod
          status=0
          fomoxac generate --check || status=$?
          rm -f go.mod
          exit $status
